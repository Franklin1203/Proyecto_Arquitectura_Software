services:
  rabbitmq:
    image: rabbitmq:4-management
    ports: [ "5672:5672", "15672:15672" ]

  db-pedidos:
    # MongoDB solo para pedidos
    image: mongo:7

  db-productos:
    # SQL Server solo para productos
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Clave1234!"

  pedidos-servicio:
    build: ./pedidos-servicio
    ports: [ "3001:3001" ]
    environment:
      PORT: 3001
      MONGO_URI: mongodb://db-pedidos:27017/pedidos
      RABBIT_URL: amqp://rabbitmq
    depends_on: [ db-pedidos, rabbitmq ]

  productos-servicio:
    build: ./productos-servicio
    ports: [ "3002:3002" ]
    environment:
      PORT: 3002
      SQL_SERVER: db-productos
      SQL_USER: sa
      SQL_PASSWORD: "Clave1234!"
      RABBIT_URL: amqp://rabbitmq
    depends_on: [ db-productos, rabbitmq ]
